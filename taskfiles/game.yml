version: "3.0"

set: ['e', 'u', 'pipefail']

tasks:
  bootstrap:
    desc: "Install the pinned Godot toolchain and gdUnit4 (checksum-verified downloads)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - ./tools/bootstrap.py game all

  godot:
    desc: "Run the resolved Godot binary (mise, or the pinned fallback download)"
    summary: |
      task game:godot -- --headless --version
    dir: "{{.ROOT_DIR}}"
    cmds:
      - ./tools/run.py godot {{.CLI_ARGS}}

  import:
    desc: "Headless Godot import of the game/ project"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - ./tools/run.py godot --headless --path game --import

  test:
    desc: "Run the game/tests/ suite headlessly through gdUnit4"
    summary: |
      task game:test

      Non-zero exit on any failing test case (gdUnit4's own CI exit codes,
      not a wrapper-imposed one).
    dir: "{{.ROOT_DIR}}"
    cmds:
      - ./tools/run.py godot --headless --path game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests --ignoreHeadlessMode

  boundary-check:
    desc: "Fail on any .gd file outside game/simulation/ crossing the sim boundary, or an undeclared platform binary in game/bin/ (TASK-029)"
    summary: |
      task game:boundary-check

      Runs tools/validate_simulation_boundary.py, which scans every .gd
      file outside game/simulation/ (excluding vendored game/addons/) for a
      NeoSnakeWorld reference, a sim-verb name call (reference/snake.html's
      advance/placeFood/tickMs/speedMul), or global RNG usage, then
      separately walks game/bin/ for platform binaries not referenced by
      any key in neo_snake.gdextension -- the "a line got dropped while
      the binary is still sitting there" failure mode.
    dir: "{{.ROOT_DIR}}"
    cmds:
      - ./tools/validate_simulation_boundary.py
