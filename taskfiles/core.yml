version: "3.0"

set: ["e", "u", "pipefail"]

tasks:
  test:
    desc: "Run the Tier-A unit tests for the pure-Zig core (core/rng.zig, core/canon.zig, core/world.zig)"
    summary: |
      task core:test

      Runs `zig build test` inside core/, which builds core/rng.zig,
      core/canon.zig, and core/world.zig as separate test modules under a
      single `test` step (docs/build-layout.md). No libc is linked and no allocator is used, so
      this is the fast pure-Zig gate that runs before the slower Godot steps.
    dir: core
    cmds:
      - zig build test

  abi-header-check:
    desc: "Compile-only smoke check that include/neo_snake.h is self-consistent and every declared symbol is usable"
    summary: |
      task core:abi-header-check

      Compiles core/abi_header_check.c to an object file only (never
      linked or run) against include/neo_snake.h — no implementation
      exists yet (core/abi.zig is TASK-024), so this proves the header
      itself is well-formed and that every declared type/function is
      genuinely usable (e.g. ns_player_view_get at player_count == 1,
      TASK-023 AC #1), not just that it parses.
    dir: core
    cmds:
      - zig cc -std=c11 -Wall -Wextra -I../include -c abi_header_check.c -o /dev/null

  abi-symbols:
    desc: "Build core/abi.zig's static library and assert it exports only ns_* symbols (TASK-024 AC #1)"
    summary: |
      task core:abi-symbols

      Runs `zig build abi` to produce zig-out/lib/libneo_snake.a, then greps
      its defined (non-undefined) global symbol table with `nm -g
      --defined-only`. Every entry must match `^ns_` — core/abi.zig is the
      only Zig file in the project allowed to `export` (AC #2), and this is
      the mechanical check that nothing besides its intended ns_* surface
      leaked into the library's global symbol table.
    dir: core
    cmds:
      - zig build abi
      - |
        bad=$(nm -g --defined-only zig-out/lib/libneo_snake.a | awk '{print $3}' | grep -vE '^ns_' || true)
        if [ -n "$bad" ]; then
          echo "Unexpected exported symbols in libneo_snake.a:" >&2
          echo "$bad" >&2
          exit 1
        fi

  abitest-purity:
    desc: "Fail if core/abitest.zig imports anything besides std (TASK-025 AC #1)"
    summary: |
      task core:abitest-purity

      Runs tools/validate_abi_test_purity.py, which greps core/abitest.zig
      for @import(...) calls and fails if any argument besides "std" is
      found. Tier-C tests must reach core/abi.zig exclusively through
      @cImport(include/neo_snake.h); without this guard the file could
      silently start @import()ing rng/canon/world/corpus directly and
      degrade into a second copy of Tier-A.
    cmds:
      - ./tools/validate_abi_test_purity.py

  abitest:
    desc: "Run the Tier-C ABI conformance tests (core/abitest.zig, reached only via @cImport)"
    summary: |
      task core:abitest

      Runs `zig build abitest` inside core/, which builds core/abitest.zig
      against include/neo_snake.h via @cImport, linked against the static
      library core/abi.zig produces (docs/build-layout.md). Five named
      tests: the ABI version handshake, ns_body_copy's too-small-buffer
      required-length report, every ns_result value reachable from some
      call path, @sizeOf/@offsetOf on the wire structs matching
      docs/canonical-state.md, and a committed corpus trace replaying to
      its committed checksum using only the C API.
    dir: core
    deps: [abitest-purity]
    cmds:
      - zig build abitest

  difftest:
    desc: "Replay the committed Tier-B JSONL corpus against core/world.zig and assert every checksum/anchor matches"
    summary: |
      task core:difftest

      Runs `zig build difftest` inside core/, which builds core/difftest.zig
      as a standalone executable (docs/build-layout.md) and replays every
      trace in game/tests/corpus/ against core/world.zig, asserting each
      tick's checksum and each full-state anchor. Hermetic: reads only the
      committed corpus files, no node binary or network access required.
      On a mismatch it rewinds to the last anchor and prints a field-by-field
      diff of the first divergent tick.
    dir: core
    cmds:
      - zig build difftest
