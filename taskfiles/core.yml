version: "3.0"

set: ["e", "u", "pipefail"]

tasks:
  test:
    desc: "Run the Tier-A unit tests for the pure-Zig core (core/rng.zig, core/canon.zig, core/world.zig)"
    summary: |
      task core:test

      Runs `zig build test` inside core/, which builds core/rng.zig,
      core/canon.zig, and core/world.zig as separate test modules under a
      single `test` step (docs/build-layout.md). No libc is linked and no allocator is used, so
      this is the fast pure-Zig gate that runs before the slower Godot steps.
    dir: core
    cmds:
      - zig build test

  abi-header-check:
    desc: "Compile-only smoke check that include/neo_snake.h is self-consistent and every declared symbol is usable"
    summary: |
      task core:abi-header-check

      Compiles core/abi_header_check.c to an object file only (never
      linked or run) against include/neo_snake.h — no implementation
      exists yet (core/abi.zig is TASK-024), so this proves the header
      itself is well-formed and that every declared type/function is
      genuinely usable (e.g. ns_player_view_get at player_count == 1,
      TASK-023 AC #1), not just that it parses.
    dir: core
    cmds:
      - zig cc -std=c11 -Wall -Wextra -I../include -c abi_header_check.c -o /dev/null

  difftest:
    desc: "Replay the committed Tier-B JSONL corpus against core/world.zig and assert every checksum/anchor matches"
    summary: |
      task core:difftest

      Runs `zig build difftest` inside core/, which builds core/difftest.zig
      as a standalone executable (docs/build-layout.md) and replays every
      trace in game/tests/corpus/ against core/world.zig, asserting each
      tick's checksum and each full-state anchor. Hermetic: reads only the
      committed corpus files, no node binary or network access required.
      On a mismatch it rewinds to the last anchor and prints a field-by-field
      diff of the first divergent tick.
    dir: core
    cmds:
      - zig build difftest
