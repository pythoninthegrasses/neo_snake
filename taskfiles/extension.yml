version: "3.0"

set: ['e', 'u', 'pipefail']

tasks:
  build:
    desc: "Build the GDExtension shim (extension/SConstruct) linking core/zig-out/lib/libneo_snake.a"
    summary: |
      task extension:build

      Runs `scons` inside extension/, which SConscripts into
      third_party/godot-cpp's own SConstruct (api_version "4.7"), links
      core/zig-out/lib/libneo_snake.a as an env.File(...) dependency (so a
      rebuilt core lib triggers a relink, unlike a bare -lneo_snake flag),
      and produces game/bin/libneo_snake<suffix><SHLIBSUFFIX> — the shared
      library game/bin/neo_snake.gdextension (TASK-027) will point to.

      Gated platforms: [linux] (TASK-043): a bare `scons` on macOS defaults
      to arch=universal (x86_64 + arm64), but core/zig-out/lib/libneo_snake.a
      is single-arch (whatever `zig build abi` natively targets) -- linking
      universal against it fails with "symbol(s) not found for architecture
      x86_64". extension:build-macos is the macOS-specific replacement,
      pinning arch=arm64 explicitly for both targets.

      ZIG_TARGET_FLAG (optional, e.g. "-Dtarget=x86_64-linux-gnu.2.28") lets
      docker/linux/Dockerfile (TASK-045) pin the built library's glibc floor
      explicitly to match Godot's own shipped linux_release.x86_64 export
      template, rather than whatever glibc the build host happens to have;
      left empty it's zig's own default native-target build, unchanged from
      before TASK-045.
    platforms: [linux]
    dir: extension
    vars:
      ZIG_TARGET_FLAG: '{{.ZIG_TARGET_FLAG | default ""}}'
    cmds:
      - task: :core:abi-symbols
        vars:
          ZIG_TARGET_FLAG: "{{.ZIG_TARGET_FLAG}}"
      - scons

  build-macos:
    desc: "Build the macOS (darwin/arm64) framework-bundle GDExtension via scons, for both debug and release targets (TASK-043)"
    summary: |
      task extension:build-macos

      macOS-only counterpart to extension:build. Rebuilds
      core/zig-out/lib/libneo_snake.a pinned to -Dtarget=aarch64-macos
      (native on this host, so the pin is explicit rather than
      load-bearing), then runs scons twice inside extension/
      (platform=macos arch=arm64, once per target=template_debug and
      target=template_release) so extension/SConstruct's macOS branch
      produces both
      game/bin/libneo_snake.macos.template_debug.framework/ and
      .../template_release.framework/ bundles, matching
      game/bin/neo_snake.gdextension's macos.debug/macos.release keys.

      Gated platforms: [darwin/arm64] (see taskfiles/parity.yml's
      platforms: [linux] precedent) so `task check` on any other host
      silently skips this instead of attempting a cross build.
    platforms: [darwin/arm64]
    dir: extension
    cmds:
      - task: :core:abi-symbols
        vars:
          ZIG_TARGET_FLAG: "-Dtarget=aarch64-macos"
      - scons platform=macos arch=arm64 target=template_debug
      - scons platform=macos arch=arm64 target=template_release
