version: "3.0"

set: ['e', 'u', 'pipefail']

tasks:
  render:
    desc: "Render audio/src/sfx/*.chip.json patches to committed WAVs under game/content/audio/sfx/"
    summary: |
      task audio:render

      Runs tools/render_audio.py --all, regenerating
      game/content/audio/sfx/*.wav from every audio/src/sfx/*.chip.json
      patch. Committed under game/content/ (not audio/build/) so Godot's
      res:// filesystem can load them directly (TASK-039). Run this after
      adding/editing a patch, then commit the resulting WAV alongside it
      (TASK-039 AC#2).
    dir: "{{.ROOT_DIR}}"
    cmds:
      - ./tools/render_audio.py --all

  check:
    desc: "Assert render_audio.py is byte-reproducible and every committed SFX WAV matches a fresh render of its source patch"
    summary: |
      task audio:check

      Runs tools/render_audio.py --self-test (proves two renders of the
      same patch are byte-identical, TASK-038 AC#2), then --all --check
      (re-renders every audio/src/sfx/*.chip.json into memory and diffs it
      against the committed game/content/audio/sfx/*.wav, failing on any
      byte diff, TASK-038 AC#3). Passes trivially with 0 patches. Pure stdlib
      Python, no Wayland/GUI dependency, so -- unlike parity:capture or
      oracle:fuzz -- there's no environmental reason to keep this out of
      `task check`; it's wired into the main chain (see
      docs/build-layout.md).
    dir: "{{.ROOT_DIR}}"
    cmds:
      - ./tools/render_audio.py --self-test
      - ./tools/render_audio.py --all --check

  music-render:
    desc: "Render audio/src/music/*.fur to committed OGG under game/content/audio/music/"
    summary: |
      task audio:music-render

      Runs tools/render_music.py --all, regenerating
      game/content/audio/music/*.ogg from every audio/src/music/*.fur
      master via the pinned `furnace` binary (bootstrap with
      `./tools/bootstrap.py game furnace` first). Committed under
      game/content/ so Godot's res:// filesystem can load them directly
      (TASK-040). Run this after adding/editing a master, then commit the
      resulting OGG alongside it (TASK-040 AC#2).
    dir: "{{.ROOT_DIR}}"
    cmds:
      - ./tools/render_music.py --all

  music-check:
    desc: "Assert render_music.py is reproducible and every committed music OGG decodes to the same samples as a fresh render of its source"
    summary: |
      task audio:music-check

      Runs tools/render_music.py --self-test (proves two furnace renders of
      the same .fur are byte-identical WAVs), then --all --check (re-renders
      every audio/src/music/*.fur and decodes both it and the committed
      game/content/audio/music/*.ogg with soundfile, failing if the decoded
      samples differ -- the committed .ogg bytes themselves are never
      byte-reproducible, since libogg randomizes each stream's serial
      number, TASK-040). Requires the pinned `furnace` binary
      (`./tools/bootstrap.py game furnace`), so -- unlike audio:check --
      this is an external-binary dependency, the same category as
      game:test's Godot/gdUnit4 requirement; it's wired into the main
      `check:` chain on that same precedent (see docs/build-layout.md).

      Gated platforms: [linux] (TASK-043): the --all --check comparison
      decodes both a fresh render and the committed .ogg back to PCM and
      requires exact sample equality. Furnace's synthesis itself is
      cross-platform deterministic (confirmed: identical sample count on
      darwin/arm64), but the OGG Vorbis encode step (libsndfile/libvorbis)
      produces small floating-point differences across platforms/builds
      (observed: max abs diff ~0.014, ~3.8% of samples), so exact-equality
      only holds against the platform the committed asset was rendered on
      (Linux) -- same platforms: gating pattern as extension:build vs
      extension:build-macos.
    platforms: [linux]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - ./tools/render_music.py --self-test
      - ./tools/render_music.py --all --check
